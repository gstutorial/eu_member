<script>

let removedEmployees = [];
let addedEmployees = [];
let latestMonthName = "";

let globalOldMap = new Map();
let globalNewMap = new Map();

function showToast(message,type='info'){
    const toast = document.getElementById('toast');
    toast.innerHTML = message;
    if(type === 'success'){
        toast.style.background = 'linear-gradient(135deg,#059669,#10b981)';
    } else if(type === 'error'){
        toast.style.background = 'linear-gradient(135deg,#dc2626,#ef4444)';
    } else{
        toast.style.background = 'linear-gradient(135deg,#111827,#1f2937)';
    }
    toast.style.display = 'block';
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(()=>{
        toast.style.display = 'none';
    },3500);
}

function showFileName(input,id){
    const fileName = document.getElementById(id);
    if(input.files.length > 0){
        fileName.innerHTML = "✅ " + input.files[0].name;
        input.parentElement.querySelector('.upload-ui').classList.add('file-success');
    }
}

function getMonthValue(fileName){
    const months = {
        jan:1, feb:2, mar:3, apr:4, may:5, jun:6,
        jul:7, aug:8, sep:9, oct:10, nov:11, dec:12
    };
    const regex = /EU\s+([A-Za-z]+)\s+(\d{4})/i;
    const match = fileName.match(regex);
    if(!match){ return null; }
    const month = months[match[1].substring(0,3).toLowerCase()];
    const year = parseInt(match[2]);
    return (year * 100) + month;
}

function extractMonthYearFromFileName(fileName){
    const regex = /EU\s+([A-Za-z]+)\s+(\d{4})/i;
    const match = fileName.match(regex);
    if(!match){ return null; }
    return { monthName:match[1], year:match[2] };
}

async function readExcel(file){
    return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = function(e){
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data,{type:'array'});
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, {header:1});
            resolve(json);
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
    });
}

async function compareFiles(){
    const oldFile = document.getElementById('oldFile').files[0];
    const newFile = document.getElementById('newFile').files[0];

    if(!oldFile || !newFile){
        showToast("⚠️ Please upload both XLSX files", 'error');
        return;
    }

    const oldMonthValue = getMonthValue(oldFile.name);
    const newMonthValue = getMonthValue(newFile.name);

    if(oldMonthValue && newMonthValue && oldMonthValue > newMonthValue){
        showToast("⚠️ Wrong File Order! Upload older month first.", "error");
        return;
    }

    const latestData = extractMonthYearFromFileName(newFile.name);
    if(latestData){
        latestMonthName = latestData.monthName + " " + latestData.year;
    }

    document.getElementById('loading').style.display='block';
    
    document.getElementById('searchSection').style.display = 'none';
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('searchInput').value = '';

    const oldData = await readExcel(oldFile);
    const newData = await readExcel(newFile);

    globalOldMap.clear();
    globalNewMap.clear();

    oldData.forEach(row=>{
        const empNo = row[5];
        const empName = row[6];
        if(empNo && empName){
            globalOldMap.set(
                String(empNo).trim(),
                { empNo:String(empNo).trim(), empName:String(empName).trim() }
            );
        }
    });

    newData.forEach(row=>{
        const empNo = row[5];
        const empName = row[6];
        if(empNo && empName){
            globalNewMap.set(
                String(empNo).trim(),
                { empNo:String(empNo).trim(), empName:String(empName).trim() }
            );
        }
    });

    removedEmployees = [];
    addedEmployees = [];

    globalOldMap.forEach((value,key)=>{
        if(!globalNewMap.has(key)){
            removedEmployees.push(value);
        }
    });

    globalNewMap.forEach((value,key)=>{
        if(!globalOldMap.has(key)){
            addedEmployees.push(value);
        }
    });

    document.getElementById('removedCount').innerText = removedEmployees.length;
    document.getElementById('addedCount').innerText = addedEmployees.length;
    document.getElementById('totalMembers').innerText = globalNewMap.size;
    document.getElementById('loading').style.display='none';
    document.getElementById('resultBox').style.display='flex';
    document.getElementById('searchSection').style.display='block';

    showToast('✅ Files compared successfully', 'success');
}

// ==========================================
// SEARCH FUNCTIONALITY
// ==========================================
function searchEmployee() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const resultsContainer = document.getElementById('searchResults');
    
    resultsContainer.innerHTML = '';

    if (!query) {
        showToast("⚠️ Please enter an Employee Name or Number", "error");
        return;
    }

    const matches = new Map();

    globalNewMap.forEach((val, key) => {
        if (key.toLowerCase().includes(query) || val.empName.toLowerCase().includes(query)) {
            matches.set(key, { empNo: key, empName: val.empName, isMember: true });
        }
    });

    globalOldMap.forEach((val, key) => {
        if (key.toLowerCase().includes(query) || val.empName.toLowerCase().includes(query)) {
            if (!matches.has(key)) {
                matches.set(key, { empNo: key, empName: val.empName, isMember: false });
            }
        }
    });

    if (matches.size === 0) {
        resultsContainer.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:10px 0;">No matching employees found in either file.</div>';
        return;
    }

    matches.forEach((data) => {
        const card = document.createElement('div');
        card.className = 'search-card';
        
        const statusClass = data.isMember ? 'status-yes' : 'status-no';
        const statusText = data.isMember ? 'Membership: YES' : 'Membership: NO';

        // UPDATED: Now placed full name on top row, Emp No & Badge on bottom row
        card.innerHTML = `
            <div class="emp-name">${data.empName}</div>
            <div class="card-bottom">
                <div class="emp-no">Emp No: ${data.empNo}</div>
                <div class="status-badge ${statusClass}">
                    ${statusText}
                </div>
            </div>
        `;
        resultsContainer.appendChild(card);
    });
}

function clearSearchUI() {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('searchInput').focus();
}

document.getElementById("searchInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        searchEmployee();
    }
});


// ==========================================
// PDF GENERATION
// ==========================================
async function createPDFBlob(title, data){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const logo = new Image();

    logo.src = "logo.png";
    
    return new Promise(resolve=>{
        logo.onload = function(){
            renderPDF(doc, logo, title, data);
            resolve(doc.output('blob'));
        };
        logo.onerror = function() {
            renderPDF(doc, null, title, data);
            resolve(doc.output('blob'));
        }
    });
}

function renderPDF(doc, logo, title, data) {
    doc.setFillColor(37,99,235);
    doc.rect(0, 0, 210, 42, 'F');

    if (logo) {
        doc.addImage(logo, 'PNG', 12, 7, 24, 24);
    }

    doc.setTextColor(255,255,255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(24);
    doc.text("Employees Union", 44, 18);
    doc.setFontSize(16);
    doc.text("N.F. Railway", 44, 29);

    doc.setFillColor(248,250,252);
    doc.roundedRect(14, 54, 182, 30, 5, 5, 'F');
    doc.setDrawColor(220,220,220);
    doc.roundedRect(14, 54, 182, 30, 5, 5);
    
    doc.setTextColor(37,99,235);

async function downloadRemovedPDF(){
    if(removedEmployees.length === 0){
        showToast("No removed employees found", "error");
        return;
    }
    const blob = await createPDFBlob("Removed Members List", removedEmployees);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "Removed_Members_" + latestMonthName + ".pdf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

async function shareRemovedPDF(){
    if(removedEmployees.length === 0){
        showToast("No removed employees found", "error");
        return;
    }
    const blob = await createPDFBlob("Removed Members List", removedEmployees);
    const file = new File([blob], "Removed_Members_" + latestMonthName + ".pdf", { type:'application/pdf' });

    if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ files:[file], title: "Removed Members List" });
    } else {
        showToast("Sharing not supported", "error");
    }
}

// ==========================================

let deferredPrompt;
const installBtn = document.getElementById('installAppBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'flex';
});

installBtn.addEventListener('click', async () => {
    installBtn.style.display = 'none';
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
});

window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    showToast('✅ App Installed Successfully!', 'success');
});

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
            reg.update();
        }).catch(err => {
            console.log('SW registration failed:', err);
        });
    });
}
