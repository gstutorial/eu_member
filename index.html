<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Employees Union Member Checker
</title>

<!-- SheetJS -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- AutoTable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
    135deg,
    #020617,
    #0f172a,
    #1e293b
    );

    min-height:100vh;

    padding:8px;

    color:white;

}

.container{

    width:100%;

    position:relative;

    overflow:hidden;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border-radius:26px;

    padding:18px;

    box-shadow:
    0 15px 50px rgba(0,0,0,0.45);

    border:
    1px solid rgba(255,255,255,0.08);

}

.logo-container{

    text-align:center;

    margin-bottom:10px;

}

.logo{

    width:88px;

    height:88px;

    object-fit:contain;

    border-radius:50%;

    display:block;

    margin:auto;

    box-shadow:
    0 5px 20px rgba(0,0,0,0.35);

}

.title{

    text-align:center;

    font-size:25px;

    font-weight:bold;

    margin-bottom:4px;

}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    margin-bottom:18px;

    font-size:13px;

}

.upload-box{

    background:
    rgba(255,255,255,0.07);

    padding:16px;

    border-radius:20px;

    margin-bottom:15px;

}

.file-upload{

    margin-bottom:16px;

}

.upload-label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

    font-size:14px;

}

.custom-upload{

    display:block;

    cursor:pointer;

}

.custom-upload input{

    display:none;

}

.upload-ui{

    background:#f8fafc;

    border:2px dashed #94a3b8;

    border-radius:18px;

    padding:18px;

    text-align:center;

    transition:0.3s;

}

.upload-ui:hover{

    transform:scale(1.01);

}

.upload-icon{

    font-size:32px;

    margin-bottom:6px;

}

.upload-text{

    color:#0f172a;

    font-weight:bold;

    font-size:14px;

    margin-bottom:6px;

}

.file-name{

    color:#475569;

    font-size:12px;

    word-break:break-word;

}

.file-success{

    border-color:#16a34a !important;

    background:#dcfce7 !important;

}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}

button:hover{

    transform:translateY(-1px);

}

.result-box{

    margin-top:18px;

    display:none;

    grid-template-columns:1fr;

    gap:12px;

}

.card{

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.05)
    );

    border-radius:18px;

    padding:16px;

    border:
    1px solid rgba(255,255,255,0.08);

    text-align:center;

}

.card h2{

    margin-bottom:6px;

    font-size:18px;

}

.count{

    font-size:34px;

    font-weight:bold;

    margin-top:6px;

    margin-bottom:12px;

    color:#38bdf8;

}

.button-row{

    display:flex;

    gap:10px;

}

.download-btn{

    flex:1;

    background:
    linear-gradient(
    135deg,
    #16a34a,
    #22c55e
    );

}

.share-btn{

    width:62px;

    min-width:62px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:white;

    border:none;

    border-radius:16px;

    padding:0;

    overflow:hidden;

    box-shadow:
    0 5px 18px rgba(0,0,0,0.25);

}

.share-icon{

    width:100%;

    height:100%;

    object-fit:cover;

}

.loading{

    text-align:center;

    margin-top:15px;

    display:none;

    font-size:16px;

}

.footer{

    text-align:center;

    margin-top:18px;

    color:#cbd5e1;

    font-size:12px;

    line-height:1.6;

}

#toast{

    position:fixed;

    top:22px;

    left:50%;

    transform:translateX(-50%);

    background:
    linear-gradient(
    135deg,
    #111827,
    #1f2937
    );

    color:white;

    padding:16px 22px;

    border-radius:18px;

    font-size:14px;

    font-weight:600;

    z-index:999999;

    display:none;

    min-width:280px;

    max-width:90%;

    text-align:center;

    box-shadow:
    0 15px 40px rgba(0,0,0,0.45);

    border:
    1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(14px);

    animation:toastSlide 0.35s ease;

}

@keyframes toastSlide{

    from{

        opacity:0;

        transform:
        translateX(-50%)
        translateY(-25px);

    }

    to{

        opacity:1;

        transform:
        translateX(-50%)
        translateY(0);

    }

}

</style>

<link rel="manifest"
href="manifest.json">

<meta name="theme-color"
content="#2563eb">

<link rel="apple-touch-icon"
href="logo.png">

</head>

<body>

<div class="container">

<div class="logo-container">

<img src="logo.png"
class="logo">

</div>

<div class="title">

Employees Union Member Checker

</div>

<div class="subtitle">

Compare Monthly Union Member XLSX Files

</div>

<div class="upload-box">

<div class="file-upload">

<label class="upload-label">

OLD Month XLSX File

</label>

<label class="custom-upload">

<input type="file"
id="oldFile"
accept=".xlsx"
onchange="showFileName(this,'oldFileName')">

<div class="upload-ui">

<div class="upload-icon">📁</div>

<div class="upload-text">
Tap to Upload Old File
</div>

<div class="file-name"
id="oldFileName">
No file selected
</div>

</div>

</label>

</div>

<div class="file-upload">

<label class="upload-label">

NEW Month XLSX File

</label>

<label class="custom-upload">

<input type="file"
id="newFile"
accept=".xlsx"
onchange="showFileName(this,'newFileName')">

<div class="upload-ui">

<div class="upload-icon">📄</div>

<div class="upload-text">
Tap to Upload New File
</div>

<div class="file-name"
id="newFileName">
No file selected
</div>

</div>

</label>

</div>

<button onclick="compareFiles()">

Compare Files

</button>

</div>

<div class="loading"
id="loading">

Processing Files...

</div>

<div class="result-box"
id="resultBox">

<div class="card">

<h2>
Current Total Members
</h2>

<div class="count"
id="totalMembers">
0
</div>

</div>

<div class="card">

<h2>
Removed Employees
</h2>

<div class="count"
id="removedCount">
0
</div>

<div class="button-row">

<button class="download-btn"
onclick="downloadRemovedPDF()">

⬇ Download PDF

</button>

<button class="share-btn"
onclick="shareRemovedPDF()">

<img src="1000210033.png"
class="share-icon">

</button>

</div>

</div>

<div class="card">

<h2>
New Employees Added
</h2>

<div class="count"
id="addedCount">
0
</div>

<div class="button-row">

<button class="download-btn"
onclick="downloadAddedPDF()">

⬇ Download PDF

</button>

<button class="share-btn"
onclick="shareAddedPDF()">

<img src="1000210033.png"
class="share-icon">

</button>

</div>

</div>

</div>

<div class="footer">

NF Railway Employees Union

<br>

App Created By Gobind Sharma

</div>

</div>

<div id="toast"></div>

<script>

let removedEmployees = [];
let addedEmployees = [];
let latestMonthName = "";

function showToast(message,type='info'){

    const toast =
    document.getElementById('toast');

    toast.innerHTML = message;

    if(type === 'success'){

        toast.style.background =
        'linear-gradient(135deg,#059669,#10b981)';

    }

    else if(type === 'error'){

        toast.style.background =
        'linear-gradient(135deg,#dc2626,#ef4444)';

    }

    else{

        toast.style.background =
        'linear-gradient(135deg,#111827,#1f2937)';

    }

    toast.style.display = 'block';

    clearTimeout(window.toastTimer);

    window.toastTimer =
    setTimeout(()=>{

        toast.style.display = 'none';

    },3500);

}

function showFileName(input,id){

    const fileName =
    document.getElementById(id);

    if(input.files.length > 0){

        fileName.innerHTML =
        "✅ " + input.files[0].name;

        input.parentElement
        .querySelector('.upload-ui')
        .classList.add('file-success');

    }

}

function getMonthValue(fileName){

    const months = {

        jan:1,
        feb:2,
        mar:3,
        apr:4,
        may:5,
        jun:6,
        jul:7,
        aug:8,
        sep:9,
        oct:10,
        nov:11,
        dec:12

    };

    const regex =
    /EU\s+([A-Za-z]+)\s+(\d{4})/i;

    const match =
    fileName.match(regex);

    if(!match){

        return null;

    }

    const month =
    months[
    match[1]
    .substring(0,3)
    .toLowerCase()
    ];

    const year =
    parseInt(match[2]);

    return (year * 100) + month;

}

function extractMonthYearFromFileName(fileName){

    const regex =
    /EU\s+([A-Za-z]+)\s+(\d{4})/i;

    const match =
    fileName.match(regex);

    if(!match){
        return null;
    }

    return {
        monthName:match[1],
        year:match[2]
    };

}

async function readExcel(file){

    return new Promise((resolve,reject)=>{

        const reader =
        new FileReader();

        reader.onload = function(e){

            const data =
            new Uint8Array(e.target.result);

            const workbook =
            XLSX.read(data,{type:'array'});

            const sheetName =
            workbook.SheetNames[0];

            const worksheet =
            workbook.Sheets[sheetName];

            const json =
            XLSX.utils.sheet_to_json(
                worksheet,
                {header:1}
            );

            resolve(json);

        };

        reader.onerror = reject;

        reader.readAsArrayBuffer(file);

    });

}

async function compareFiles(){

    const oldFile =
    document.getElementById('oldFile').files[0];

    const newFile =
    document.getElementById('newFile').files[0];

    if(!oldFile || !newFile){

        showToast(
        "⚠️ Please upload both XLSX files",
        'error'
        );

        return;

    }

    const oldMonthValue =
    getMonthValue(oldFile.name);

    const newMonthValue =
    getMonthValue(newFile.name);

    if(

    oldMonthValue &&
    newMonthValue &&
    oldMonthValue > newMonthValue

    ){

        showToast(

        "⚠️ Wrong File Order! Upload older month first.",

        "error"

        );

        return;

    }

    const latestData =
    extractMonthYearFromFileName(
    newFile.name
    );

    if(latestData){

        latestMonthName =
        latestData.monthName +
        " " +
        latestData.year;

    }

    document.getElementById(
    'loading'
    ).style.display='block';

    const oldData =
    await readExcel(oldFile);

    const newData =
    await readExcel(newFile);

    const oldMap = new Map();
    const newMap = new Map();

    oldData.forEach(row=>{

        const empNo = row[5];
        const empName = row[6];

        if(empNo && empName){

            oldMap.set(
                String(empNo).trim(),
                {
                    empNo:String(empNo).trim(),
                    empName:String(empName).trim()
                }
            );

        }

    });

    newData.forEach(row=>{

        const empNo = row[5];
        const empName = row[6];

        if(empNo && empName){

            newMap.set(
                String(empNo).trim(),
                {
                    empNo:String(empNo).trim(),
                    empName:String(empName).trim()
                }
            );

        }

    });

    removedEmployees = [];
    addedEmployees = [];

    oldMap.forEach((value,key)=>{

        if(!newMap.has(key)){
            removedEmployees.push(value);
        }

    });

    newMap.forEach((value,key)=>{

        if(!oldMap.has(key)){
            addedEmployees.push(value);
        }

    });

    document.getElementById(
    'removedCount'
    ).innerText =
    removedEmployees.length;

    document.getElementById(
    'addedCount'
    ).innerText =
    addedEmployees.length;

    document.getElementById(
    'totalMembers'
    ).innerText =
    newMap.size;

    document.getElementById(
    'loading'
    ).style.display='none';

    document.getElementById(
    'resultBox'
    ).style.display='grid';

    showToast(
    '✅ Files compared successfully',
    'success'
    );

}

async function createPDFBlob(
title,
data
){

    const { jsPDF } =
    window.jspdf;

    const doc =
    new jsPDF();

    const logo =
    new Image();

    logo.src = "logo.png";

    return new Promise(resolve=>{

        logo.onload = function(){

            doc.addImage(
                logo,
                'PNG',
                15,
                12,
                28,
                28
            );

            doc.setFont(
            "helvetica",
            "bold"
            );

            doc.setFontSize(28);

            doc.setTextColor(
            15,23,42
            );

            doc.text(
                "Employees Union",
                105,
                22,
                {align:'center'}
            );

            doc.setFontSize(20);

            doc.setTextColor(
            37,99,235
            );

            doc.text(
                "N.F. Railway",
                105,
                33,
                {align:'center'}
            );

            doc.setDrawColor(
            37,99,235
            );

            doc.setLineWidth(1);

            doc.line(
                12,
                45,
                198,
                45
            );

            doc.setFontSize(21);

            doc.setTextColor(
            37,99,235
            );

            doc.text(
                title,
                105,
                58,
                {align:'center'}
            );

            doc.setFontSize(14);

            doc.setTextColor(
            0,0,0
            );

            doc.text(
                "Month: " +
                latestMonthName,
                105,
                68,
                {align:'center'}
            );

            doc.text(
                "Total Members: "
                + data.length,
                105,
                78,
                {align:'center'}
            );

            const tableData =
            data.map(emp=>[
                emp.empName,
                emp.empNo
            ]);

            doc.autoTable({

                head:[[
                    'Employee Name',
                    'Employee Number'
                ]],

                body:tableData,

                startY:90,

                styles:{
                    fontSize:10,
                    cellPadding:4,
                    halign:'left',
                    valign:'middle'
                },

                headStyles:{
                    fillColor:[37,99,235],
                    halign:'left',
                    valign:'middle',
                    textColor:[255,255,255],
                    fontStyle:'bold'
                },

                alternateRowStyles:{
                    fillColor:[240,245,255]
                }

            });

            doc.setFontSize(10);

            doc.setTextColor(100);

            doc.text(

                "App Created By Gobind Sharma",

                105,

                doc.internal
                .pageSize.height - 10,

                {align:'center'}

            );

            const blob =
            doc.output('blob');

            resolve(blob);

        };

    });

}

async function downloadRemovedPDF(){

    if(removedEmployees.length === 0){

        showToast(
        "No removed employees found",
        "error"
        );

        return;

    }

    const blob =
    await createPDFBlob(
        "Removed Members List",
        removedEmployees
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement('a');

    a.href = url;

    a.download =
    "Removed_Members_" +
    latestMonthName +
    ".pdf";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

async function downloadAddedPDF(){

    if(addedEmployees.length === 0){

        showToast(
        "No new employees found",
        "error"
        );

        return;

    }

    const blob =
    await createPDFBlob(
        "Newly Added Members List",
        addedEmployees
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement('a');

    a.href = url;

    a.download =
    "New_Members_" +
    latestMonthName +
    ".pdf";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

async function shareRemovedPDF(){

    if(removedEmployees.length === 0){

        showToast(
        "No removed employees found",
        "error"
        );

        return;

    }

    const blob =
    await createPDFBlob(
        "Removed Members List",
        removedEmployees
    );

    const file =
    new File(
        [blob],
        "Removed_Members_" +
        latestMonthName +
        ".pdf",
        {
            type:'application/pdf'
        }
    );

    if(
    navigator.canShare &&
    navigator.canShare({files:[file]})
    ){

        await navigator.share({

            files:[file],

            title:
            "Removed Members List"

        });

    }

    else{

        showToast(
        "Sharing not supported on this device",
        "error"
        );

    }

}

async function shareAddedPDF(){

    if(addedEmployees.length === 0){

        showToast(
        "No new employees found",
        "error"
        );

        return;

    }

    const blob =
    await createPDFBlob(
        "Newly Added Members List",
        addedEmployees
    );

    const file =
    new File(
        [blob],
        "New_Members_" +
        latestMonthName +
        ".pdf",
        {
            type:'application/pdf'
        }
    );

    if(
    navigator.canShare &&
    navigator.canShare({files:[file]})
    ){

        await navigator.share({

            files:[file],

            title:
            "New Members List"

        });

    }

    else{

        showToast(
        "Sharing not supported on this device",
        "error"
        );

    }

}

</script>

<script>

if('serviceWorker' in navigator){

    navigator.serviceWorker
    .register('sw.js');

}

</script>

</body>
