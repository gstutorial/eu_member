<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Employees Union Member Checker
</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<link rel="manifest"
href="manifest.json">

<meta name="theme-color"
content="#2563eb">

<link rel="apple-touch-icon"
href="logo.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:
    Arial,sans-serif;

    background:
    radial-gradient(
    circle at top,
    #1e3a8a 0%,
    #0f172a 40%,
    #020617 100%
    );

    min-height:100vh;

    padding:8px;

    color:white;

}

.container{

    width:100%;

    max-width:650px;

    margin:auto;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.04)
    );

    border-radius:30px;

    padding:18px;

    border:
    1px solid rgba(255,255,255,0.10);

    backdrop-filter:blur(20px);

    box-shadow:
    0 15px 50px rgba(0,0,0,0.45);

}

.logo-container{

    text-align:center;

    margin-bottom:8px;

}

.logo{

    width:95px;

    height:95px;

    object-fit:contain;

    border-radius:50%;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.40);

}

.title{

    text-align:center;

    font-size:28px;

    font-weight:800;

    line-height:1.15;

    margin-top:8px;

}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    font-size:14px;

    margin-top:8px;

    margin-bottom:18px;

}

.upload-box{

    background:
    rgba(255,255,255,0.06);

    border-radius:24px;

    padding:16px;

}

.file-upload{

    margin-bottom:14px;

}

.upload-label{

    font-size:14px;

    font-weight:bold;

    margin-bottom:8px;

    display:block;

}

.custom-upload{

    display:block;

    cursor:pointer;

}

.custom-upload input{

    display:none;

}

.upload-ui{

    background:
    linear-gradient(
    135deg,
    #ecfdf5,
    #d1fae5
    );

    border:
    3px dashed #22c55e;

    border-radius:24px;

    padding:20px 12px;

    text-align:center;

    transition:0.3s;

}

.upload-ui:hover{

    transform:scale(1.01);

}

.upload-icon{

    font-size:40px;

    margin-bottom:8px;

}

.upload-text{

    color:#0f172a;

    font-size:17px;

    font-weight:700;

    margin-bottom:8px;

}

.file-name{

    color:#475569;

    font-size:13px;

    font-weight:600;

}

.file-success{

    border-color:#16a34a !important;

    background:
    linear-gradient(
    135deg,
    #dcfce7,
    #bbf7d0
    ) !important;

}

.compare-btn{

    width:100%;

    border:none;

    border-radius:18px;

    padding:15px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;

    font-size:18px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
    0 10px 25px rgba(37,99,235,0.35);

}

.result-box{

    margin-top:14px;

    display:none;

    flex-direction:column;

    gap:12px;

}

.card{

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.10),
    rgba(255,255,255,0.05)
    );

    border-radius:24px;

    padding:16px;

    border:
    1px solid rgba(255,255,255,0.10);

    box-shadow:
    0 8px 25px rgba(0,0,0,0.20);

}

.card-header{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:6px;

}

.card-icon{

    width:54px;

    height:54px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:24px;

    color:white;

    font-weight:bold;

}

.blue{
    background:
    linear-gradient(
    135deg,
    #2563eb,
    #60a5fa
    );
}

.red{
    background:
    linear-gradient(
    135deg,
    #dc2626,
    #ef4444
    );
}

.green{
    background:
    linear-gradient(
    135deg,
    #16a34a,
    #4ade80
    );
}

.card-title{

    font-size:16px;

    font-weight:700;

    line-height:1.2;

}

.count{

    font-size:46px;

    font-weight:900;

    color:#38bdf8;

    margin-left:66px;

    margin-bottom:12px;

    line-height:1;

}

.button-row{

    display:flex;

    gap:10px;

}

.download-btn{

    flex:1;

    border:none;

    border-radius:16px;

    padding:13px;

    background:
    linear-gradient(
    135deg,
    #16a34a,
    #22c55e
    );

    color:white;

    font-size:16px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    cursor:pointer;

    box-shadow:
    0 8px 20px rgba(34,197,94,0.35);

}

.share-btn{

    width:120px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #38bdf8
    );

    color:white;

    font-size:16px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    cursor:pointer;

    box-shadow:
    0 8px 20px rgba(59,130,246,0.35);

}

.loading{

    display:none;

    text-align:center;

    margin-top:16px;

    font-size:17px;

    font-weight:700;

}

.footer{

    text-align:center;

    margin-top:18px;

    color:#cbd5e1;

    font-size:12px;

    line-height:1.6;

}

#toast{

    position:fixed;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    background:
    linear-gradient(
    135deg,
    #111827,
    #1f2937
    );

    padding:14px 20px;

    border-radius:18px;

    color:white;

    font-weight:700;

    z-index:9999;

    display:none;

    min-width:260px;

    text-align:center;

    box-shadow:
    0 10px 35px rgba(0,0,0,0.40);

}

@media(max-width:600px){

    .container{

        padding:14px;

        border-radius:26px;

    }

    .logo{

        width:88px;

        height:88px;

    }

    .title{

        font-size:22px;

    }

    .subtitle{

        font-size:13px;

        margin-bottom:14px;

    }

    .upload-box{

        padding:14px;

        border-radius:22px;

    }

    .upload-ui{

        padding:18px 12px;

        border-radius:22px;

    }

    .upload-icon{

        font-size:34px;

    }

    .upload-text{

        font-size:15px;

    }

    .file-name{

        font-size:12px;

    }

    .compare-btn{

        padding:14px;

        font-size:17px;

        border-radius:18px;

    }

    .result-box{

        gap:10px;

        margin-top:12px;

    }

    .card{

        padding:14px;

        border-radius:22px;

    }

    .card-header{

        gap:10px;

        margin-bottom:4px;

    }

    .card-icon{

        width:46px;

        height:46px;

        font-size:20px;

    }

    .card-title{

        font-size:15px;

    }

    .count{

        font-size:40px;

        margin-left:56px;

        margin-bottom:10px;

    }

    .button-row{

        gap:8px;

    }

    .download-btn{

        padding:11px;

        font-size:14px;

        border-radius:14px;

    }

    .share-btn{

        width:105px;

        font-size:14px;

        border-radius:14px;

    }

}

</style>

</head>

<body>

<div class="container">

<div class="logo-container">

<img src="logo.png"
class="logo">

</div>

<div class="title">

Employees Union Member Checker

</div>

<div class="subtitle">

Compare Monthly Union Member XLSX Files

</div>

<div class="upload-box">

<div class="file-upload">

<label class="upload-label">

OLD Month XLSX File

</label>

<label class="custom-upload">

<input type="file"
id="oldFile"
accept=".xlsx"
onchange="showFileName(this,'oldFileName')">

<div class="upload-ui">

<div class="upload-icon">
📁
</div>

<div class="upload-text">
Tap to Upload Old File
</div>

<div class="file-name"
id="oldFileName">
No file selected
</div>

</div>

</label>

</div>

<div class="file-upload">

<label class="upload-label">

NEW Month XLSX File

</label>

<label class="custom-upload">

<input type="file"
id="newFile"
accept=".xlsx"
onchange="showFileName(this,'newFileName')">

<div class="upload-ui">

<div class="upload-icon">
📄
</div>

<div class="upload-text">
Tap to Upload New File
</div>

<div class="file-name"
id="newFileName">
No file selected
</div>

</div>

</label>

</div>

<button class="compare-btn"
onclick="compareFiles()">

📑 Compare Files

</button>

</div>

<div class="loading"
id="loading">

Processing Files...

</div>

<div class="result-box"
id="resultBox">

<div class="card">

<div class="card-header">

<div class="card-icon blue">
👥
</div>

<div class="card-title">
Current Total Members
</div>

</div>

<div class="count"
id="totalMembers">
0
</div>

</div>

<div class="card">

<div class="card-header">

<div class="card-icon red">
➖
</div>

<div class="card-title">
Removed Employees
</div>

</div>

<div class="count"
id="removedCount">
0
</div>

<div class="button-row">

<button class="download-btn"
onclick="downloadRemovedPDF()">

⬇ Download

</button>

<button class="share-btn"
onclick="shareRemovedPDF()">

🔗 Share

</button>

</div>

</div>

<div class="card">

<div class="card-header">

<div class="card-icon green">
➕

</div>

<div class="card-title">
New Employees Added
</div>

</div>

<div class="count"
id="addedCount">
0
</div>

<div class="button-row">

<button class="download-btn"
onclick="downloadAddedPDF()">

⬇ Download

</button>

<button class="share-btn"
onclick="shareAddedPDF()">

🔗 Share

</button>

</div>

</div>

</div>

<div class="footer">

NF Railway Employees Union

<br>

App Created By Gobind Sharma

</div>

</div>

<div id="toast"></div>

<script>

let removedEmployees = [];
let addedEmployees = [];
let latestMonthName = "";

function showToast(message,type='info'){

    const toast =
    document.getElementById('toast');

    toast.innerHTML = message;

    if(type === 'success'){

        toast.style.background =
        'linear-gradient(135deg,#059669,#10b981)';

    }

    else if(type === 'error'){

        toast.style.background =
        'linear-gradient(135deg,#dc2626,#ef4444)';

    }

    else{

        toast.style.background =
        'linear-gradient(135deg,#111827,#1f2937)';

    }

    toast.style.display = 'block';

    clearTimeout(window.toastTimer);

    window.toastTimer =
    setTimeout(()=>{

        toast.style.display = 'none';

    },3500);

}

function showFileName(input,id){

    const fileName =
    document.getElementById(id);

    if(input.files.length > 0){

        fileName.innerHTML =
        "✅ " + input.files[0].name;

        input.parentElement
        .querySelector('.upload-ui')
        .classList.add('file-success');

    }

}

function getMonthValue(fileName){

    const months = {

        jan:1,
        feb:2,
        mar:3,
        apr:4,
        may:5,
        jun:6,
        jul:7,
        aug:8,
        sep:9,
        oct:10,
        nov:11,
        dec:12

    };

    const regex =
    /EU\s+([A-Za-z]+)\s+(\d{4})/i;

    const match =
    fileName.match(regex);

    if(!match){

        return null;

    }

    const month =
    months[
    match[1]
    .substring(0,3)
    .toLowerCase()
    ];

    const year =
    parseInt(match[2]);

    return (year * 100) + month;

}

function extractMonthYearFromFileName(fileName){

    const regex =
    /EU\s+([A-Za-z]+)\s+(\d{4})/i;

    const match =
    fileName.match(regex);

    if(!match){
        return null;
    }

    return {
        monthName:match[1],
        year:match[2]
    };

}

async function readExcel(file){

    return new Promise((resolve,reject)=>{

        const reader =
        new FileReader();

        reader.onload = function(e){

            const data =
            new Uint8Array(e.target.result);

            const workbook =
            XLSX.read(data,{type:'array'});

            const sheetName =
            workbook.SheetNames[0];

            const worksheet =
            workbook.Sheets[sheetName];

            const json =
            XLSX.utils.sheet_to_json(
                worksheet,
                {header:1}
            );

            resolve(json);

        };

        reader.onerror = reject;

        reader.readAsArrayBuffer(file);

    });

}

async function compareFiles(){

    const oldFile =
    document.getElementById('oldFile').files[0];

    const newFile =
    document.getElementById('newFile').files[0];

    if(!oldFile || !newFile){

        showToast(
        "⚠️ Please upload both XLSX files",
        'error'
        );

        return;

    }

    const oldMonthValue =
    getMonthValue(oldFile.name);

    const newMonthValue =
    getMonthValue(newFile.name);

    if(
    oldMonthValue &&
    newMonthValue &&
    oldMonthValue > newMonthValue
    ){

        showToast(
        "⚠️ Wrong File Order! Upload older month first.",
        "error"
        );

        return;

    }

    const latestData =
    extractMonthYearFromFileName(
    newFile.name
    );

    if(latestData){

        latestMonthName =
        latestData.monthName +
        " " +
        latestData.year;

    }

    document.getElementById(
    'loading'
    ).style.display='block';

    const oldData =
    await readExcel(oldFile);

    const newData =
    await readExcel(newFile);

    const oldMap = new Map();
    const newMap = new Map();

    oldData.forEach(row=>{

        const empNo = row[5];
        const empName = row[6];

        if(empNo && empName){

            oldMap.set(
                String(empNo).trim(),
                {
                    empNo:String(empNo).trim(),
                    empName:String(empName).trim()
                }
            );

        }

    });

    newData.forEach(row=>{

        const empNo = row[5];
        const empName = row[6];

        if(empNo && empName){

            newMap.set(
                String(empNo).trim(),
                {
                    empNo:String(empNo).trim(),
                    empName:String(empName).trim()
                }
            );

        }

    });

    removedEmployees = [];
    addedEmployees = [];

    oldMap.forEach((value,key)=>{

        if(!newMap.has(key)){

            removedEmployees.push(value);

        }

    });

    newMap.forEach((value,key)=>{

        if(!oldMap.has(key)){

            addedEmployees.push(value);

        }

    });

    document.getElementById(
    'removedCount'
    ).innerText =
    removedEmployees.length;

    document.getElementById(
    'addedCount'
    ).innerText =
    addedEmployees.length;

    document.getElementById(
    'totalMembers'
    ).innerText =
    newMap.size;

    document.getElementById(
    'loading'
    ).style.display='none';

    document.getElementById(
    'resultBox'
    ).style.display='flex';

    showToast(
    '✅ Files compared successfully',
    'success'
    );

}

</script>

</body>

</html>
