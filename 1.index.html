<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Employees Union Member Checker
</title>

<!-- SheetJS -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- AutoTable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e293b
    );

    min-height:100vh;

    padding:20px;

    color:white;

}

.container{

    max-width:700px;

    margin:auto;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(14px);

    border-radius:28px;

    padding:25px;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.4);

}

.logo-container{

    text-align:center;

    margin-bottom:15px;

}

.logo{

    width:110px;

    height:110px;

    object-fit:contain;

    border-radius:50%;

    background:white;

    padding:8px;

    box-shadow:
    0 5px 20px rgba(0,0,0,0.3);

}

.title{

    text-align:center;

    font-size:30px;

    font-weight:bold;

    margin-bottom:8px;

}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    margin-bottom:30px;

    font-size:15px;

}

.upload-box{

    background:
    rgba(255,255,255,0.07);

    padding:20px;

    border-radius:20px;

    margin-bottom:20px;

}

.file-upload{

    margin-bottom:22px;

}

.upload-label{

    display:block;

    margin-bottom:10px;

    font-weight:bold;

    font-size:15px;

}

.custom-upload{

    display:block;

    cursor:pointer;

}

.custom-upload input{

    display:none;

}

.upload-ui{

    background:#f8fafc;

    border:2px dashed #94a3b8;

    border-radius:18px;

    padding:25px;

    text-align:center;

    transition:0.3s;

}

.upload-ui:hover{

    border-color:#2563eb;

    transform:scale(1.01);

}

.upload-icon{

    font-size:42px;

    margin-bottom:10px;

}

.upload-text{

    color:#0f172a;

    font-weight:bold;

    font-size:16px;

    margin-bottom:10px;

}

.file-name{

    color:#475569;

    font-size:14px;

    word-break:break-word;

    margin-top:8px;

}

.file-success{

    border-color:#16a34a !important;

    background:#dcfce7 !important;

}

button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:15px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}

button:hover{

    transform:scale(1.02);

}

.result-box{

    margin-top:25px;

    display:none;

}

.card{

    background:
    rgba(255,255,255,0.08);

    border-radius:20px;

    padding:20px;

    margin-bottom:18px;

}

.card h2{

    margin-bottom:10px;

}

.count{

    font-size:32px;

    font-weight:bold;

    margin-top:10px;

    margin-bottom:15px;

}

.download-btn{

    background:
    linear-gradient(
    135deg,
    #16a34a,
    #22c55e
    );

}

.loading{

    text-align:center;

    margin-top:20px;

    display:none;

    font-size:18px;

}

.footer{

    text-align:center;

    margin-top:30px;

    color:#cbd5e1;

    font-size:13px;

}

@media(max-width:600px){

.title{

    font-size:24px;

}

button{

    font-size:16px;

}

.count{

    font-size:24px;

}

.logo{

    width:90px;

    height:90px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo-container">

<img src="logo.jpg"
class="logo">

</div>

<div class="title">

Employees Union Member Checker

</div>

<div class="subtitle">

Compare Monthly Union Member XLSX Files

</div>

<div class="upload-box">

<div class="file-upload">

<label class="upload-label">

OLD Month XLSX File

</label>

<label class="custom-upload">

<input type="file"
id="oldFile"
accept=".xlsx"
onchange="showFileName(this,'oldFileName')">

<div class="upload-ui">

<div class="upload-icon">

📁

</div>

<div class="upload-text">

Tap to Upload Old File

</div>

<div class="file-name"
id="oldFileName">

No file selected

</div>

</div>

</label>

</div>

<div class="file-upload">

<label class="upload-label">

NEW Month XLSX File

</label>

<label class="custom-upload">

<input type="file"
id="newFile"
accept=".xlsx"
onchange="showFileName(this,'newFileName')">

<div class="upload-ui">

<div class="upload-icon">

📄

</div>

<div class="upload-text">

Tap to Upload New File

</div>

<div class="file-name"
id="newFileName">

No file selected

</div>

</div>

</label>

</div>

<button onclick="compareFiles()">

Compare Files

</button>

</div>

<div class="loading"
id="loading">

Processing Files...

</div>

<div class="result-box"
id="resultBox">

<div class="card">

<h2>

Current Total Members

</h2>

<div class="count"
id="totalMembers">

0

</div>

</div>

<div class="card">

<h2>

Removed Employees

</h2>

<div class="count"
id="removedCount">

0

</div>

<button class="download-btn"
onclick="downloadRemovedPDF()">

Download Removed PDF

</button>

</div>

<div class="card">

<h2>

New Employees Added

</h2>

<div class="count"
id="addedCount">

0

</div>

<button class="download-btn"
onclick="downloadAddedPDF()">

Download Added PDF

</button>

</div>

</div>

<div class="footer">

NF Railway Employees Union

<br><br>

App Created By Gobind Sharma

</div>

</div>

<script>

let removedEmployees = [];

let addedEmployees = [];

function showFileName(input,id){

    const fileName =
    document.getElementById(id);

    if(input.files.length > 0){

        fileName.innerHTML =
        "✅ " + input.files[0].name;

        input.parentElement
        .querySelector('.upload-ui')
        .classList.add('file-success');

    }

}

async function readExcel(file){

    return new Promise((resolve,reject)=>{

        const reader = new FileReader();

        reader.onload = function(e){

            const data =
            new Uint8Array(e.target.result);

            const workbook =
            XLSX.read(data,{type:'array'});

            const sheetName =
            workbook.SheetNames[0];

            const worksheet =
            workbook.Sheets[sheetName];

            const json =
            XLSX.utils.sheet_to_json(
                worksheet,
                {header:1}
            );

            resolve(json);

        };

        reader.onerror = reject;

        reader.readAsArrayBuffer(file);

    });

}

async function compareFiles(){

    const oldFile =
    document.getElementById('oldFile').files[0];

    const newFile =
    document.getElementById('newFile').files[0];

    if(!oldFile || !newFile){

        alert(
        "Please upload both XLSX files"
        );

        return;

    }

    document.getElementById(
    'loading'
    ).style.display='block';

    const oldData =
    await readExcel(oldFile);

    const newData =
    await readExcel(newFile);

    const oldMap = new Map();

    const newMap = new Map();

    oldData.forEach(row=>{

        const empNo = row[5];

        const empName = row[6];

        if(empNo && empName){

            oldMap.set(

                String(empNo).trim(),

                {

                    empNo:
                    String(empNo).trim(),

                    empName:
                    String(empName).trim()

                }

            );

        }

    });

    newData.forEach(row=>{

        const empNo = row[5];

        const empName = row[6];

        if(empNo && empName){

            newMap.set(

                String(empNo).trim(),

                {

                    empNo:
                    String(empNo).trim(),

                    empName:
                    String(empName).trim()

                }

            );

        }

    });

    removedEmployees = [];

    addedEmployees = [];

    oldMap.forEach((value,key)=>{

        if(!newMap.has(key)){

            removedEmployees.push(value);

        }

    });

    newMap.forEach((value,key)=>{

        if(!oldMap.has(key)){

            addedEmployees.push(value);

        }

    });

    removedEmployees.sort((a,b)=>

        a.empName.localeCompare(
        b.empName)

    );

    addedEmployees.sort((a,b)=>

        a.empName.localeCompare(
        b.empName)

    );

    document.getElementById(
    'removedCount'
    ).innerText =
    removedEmployees.length;

    document.getElementById(
    'addedCount'
    ).innerText =
    addedEmployees.length;

    document.getElementById(
    'totalMembers'
    ).innerText =
    newMap.size;

    document.getElementById(
    'loading'
    ).style.display='none';

    document.getElementById(
    'resultBox'
    ).style.display='block';

}

function generatePDF(
title,
data,
fileName
){

    const { jsPDF } =
    window.jspdf;

    const doc =
    new jsPDF();

    const logo =
    new Image();

    logo.src = "logo.jpg";

    logo.onload = function(){

        /* LOGO */

        doc.addImage(
            logo,
            'JPEG',
            12,
            10,
            28,
            28
        );

        /* HEADER */

        doc.setFontSize(20);

        doc.setTextColor(20,20,20);

        doc.text(
            "Employees Union",
            50,
            18
        );

        doc.setFontSize(16);

        doc.setTextColor(60,60,60);

        doc.text(
            "N.F. Railway",
            50,
            28
        );

        /* LINE */

        doc.setDrawColor(37,99,235);

        doc.setLineWidth(1);

        doc.line(
            12,
            42,
            198,
            42
        );

        /* TITLE */

        doc.setFontSize(16);

        doc.setTextColor(37,99,235);

        doc.text(
            title,
            14,
            52
        );

        /* TOTAL */

        doc.setFontSize(12);

        doc.setTextColor(0,0,0);

        doc.text(
            "Total Number: "
            + data.length,
            14,
            62
        );

        /* TABLE */

        const tableData =
        data.map(emp=>[
            emp.empName,
            emp.empNo
        ]);

        doc.autoTable({

            head:[[
                'Employee Name',
                'Employee Number'
            ]],

            body:tableData,

            startY:70,

            styles:{
                fontSize:10,
                cellPadding:3
            },

            headStyles:{
                fillColor:[37,99,235],
                fontSize:11
            },

            alternateRowStyles:{
                fillColor:[240,245,255]
            }

        });

        /* FOOTER */

        doc.setFontSize(10);

        doc.setTextColor(100);

        doc.text(

            "App Created By Gobind Sharma",

            14,

            doc.internal
            .pageSize.height - 10

        );

        doc.save(fileName);

    };

}

function downloadRemovedPDF(){

    generatePDF(

        "Removed Members List",

        removedEmployees,

        "Removed_Employees.pdf"

    );

}

function downloadAddedPDF(){

    generatePDF(

        "Newly Added Members List",

        addedEmployees,

        "New_Employees_Added.pdf"

    );

}

</script>

</body>

</html>
